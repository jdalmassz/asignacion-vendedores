server {
  listen 80;
  root /usr/share/nginx/html;

  # La API, al backend. Va por el nombre del servicio en la red de Docker, así que el
  # navegador nunca habla con el backend directamente y no hay que abrirle un dominio.
  location /api/ {
    proxy_pass http://asignacion-backend:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Una aplicación de una sola página: cualquier ruta que no sea un fichero devuelve el
  # index y deja que el enrutador del navegador decida. Sin esto, recargar en /vendedores
  # da un 404 de nginx.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
